[project]
name = "jauge"
version = "0.1.0"
description = "Jauge — FinOps for generative AI on Amazon Bedrock: cost attribution, replay-proven model changes, staged gateway rollout."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "MSP AI FinOps" }]
dependencies = [
    "pydantic>=2.9",
    "boto3>=1.35",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[dependency-groups]
# `uv sync --all-groups` installe tout ; la CI découpe par job pour rester < 5 min.
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.6",
]
infra = [
    "aws-cdk-lib>=2.160",
    "constructs>=10.0",
    "cfn-lint>=1.20",
]
agents = [
    "strands-agents>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jauge"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".github/ci-budget", ".github/hermes"]

[tool.ruff.lint]
# E/F: pycodestyle+pyflakes, I: import order, UP: modernisation, B: bugbear, SIM: simplification
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # longueur de ligne gérée par le formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "infra: tests d'infrastructure (CDK/CloudFormation), plus lents",
    "slow: tests longs, exclus du chemin critique de la CI",
]

[tool.coverage.run]
source = ["src/jauge"]
omit = ["*/__main__.py"]
