name: CI

# Budget CI : verdict <= 5 minutes (règle user 2026-10-24). Chaque job porte
# timeout-minutes: 5, un concurrency qui annule le run précédent, et un
# checkout superficiel.
#
# Cache : les runners sont self-hosted et persistants (r630) ; le cache uv
# (/home/baptiste/.cache/uv) y est déjà chaud et préchauffé. Mesuré : sync
# 4 s, suite de tests 6 s. Pas de `actions/cache` ici : copier 700 Mo de
# cache coûtait plus de temps que l'installation qu'il évitait.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # uv est installé dans ~/.local/bin sur les runners self-hosted (r630).
  UV_CACHE_DIR: /home/runner/.cache/uv
  UV_NO_PROGRESS: "1"
  # aws-cdk-lib est un paquet jsii : il lance un processus Node (d'où node dans
  # le PATH) et extrait son runtime dans un répertoire temporaire. TMPDIR est
  # fixé hors de /tmp : un `package.json` tiers y déclare `"type": "module"`,
  # ce qui fait échouer le runtime jsii (« require is not defined in ES module
  # scope »). Ne pas supprimer ce fichier : il appartient à un autre projet.
  TMPDIR: /home/runner/.cache/jauge-tmp

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Ruff (lint + format)
        run: |
          set -euo pipefail
          command -v uv >/dev/null || python3 -m pip install --quiet --user --break-system-packages uv
          uv tool run --from 'ruff>=0.6' ruff check .
          uv tool run --from 'ruff>=0.6' ruff format --check .

  limits:
    name: limits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Tailles (fichiers < 500 lignes, fonctions < 50 lignes)
        run: python3 scripts/check_limits.py

  # La suite est découpée en trois jobs : un job unique dépassait le budget de
  # 5 min (mesuré le 2026-11-11 : « The job has exceeded the maximum execution
  # time of 5m0s » sur la PR #32, 1 078 tests). Règle user 2026-10-24 : on
  # découpe, on n'allonge JAMAIS un timeout. Le job `test` garde son nom (check
  # requis de la protection de branche et de la file Mergify) ; `test-2` et
  # `test-3` sont à ajouter aux checks requis une fois ce workflow sur main.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: "Dépendances + tests (lot 1 : API, attribution)"
        run: |
          set -euo pipefail
          command -v uv >/dev/null || python3 -m pip install --quiet --user --break-system-packages uv
          uv sync --frozen --all-groups
          uv run pytest -q -m 'not infra and not slow' tests/api tests/attribution

  test-2:
    name: test-2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: "Dépendances + tests (lot 2 : démo, recette)"
        run: |
          set -euo pipefail
          command -v uv >/dev/null || python3 -m pip install --quiet --user --break-system-packages uv
          uv sync --frozen --all-groups
          uv run pytest -q -m 'not infra and not slow' tests/demo tests/recette

  test-3:
    name: test-3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: "Dépendances + tests (lot 3 : tout le reste)"
        run: |
          set -euo pipefail
          command -v uv >/dev/null || python3 -m pip install --quiet --user --break-system-packages uv
          uv sync --frozen --all-groups
          # Tout ce qui n'est pas dans les lots 1 et 2 : les nouveaux dossiers
          # de tests sont couverts ici sans avoir à modifier ce workflow.
          uv run pytest -q -m 'not infra and not slow' \
            --ignore=tests/api --ignore=tests/attribution \
            --ignore=tests/demo --ignore=tests/recette

  iac:
    name: iac
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: CloudFormation (cfn-lint) + CDK (assertions)
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR"
          command -v node >/dev/null || { echo "::error::Node.js absent : aws-cdk-lib (jsii) en a besoin"; exit 1; }
          command -v uv >/dev/null || python3 -m pip install --quiet --user --break-system-packages uv
          uv sync --frozen --all-groups
          shopt -s nullglob globstar
          # *.asl.json = définitions Step Functions, pas des gabarits CloudFormation
          files=()
          for f in infra/**/*.yaml infra/**/*.yml infra/**/*.json; do
            case "$f" in *.asl.json) continue ;; esac
            files+=("$f")
          done
          if [ ${#files[@]} -gt 0 ]; then
            uv run --group dev --group infra cfn-lint "${files[@]}"
          else
            echo "aucun gabarit dans infra/ pour l'instant"
          fi
          if [ -d tests/infra ]; then
            uv run --group dev --group infra pytest -q -m infra
          else
            echo "aucun test infra pour l'instant"
          fi
