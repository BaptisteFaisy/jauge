name: Hermes Lite (gate)

# [HERMES-REFRESH] Gate « fraîcheur exigée au merge ».
# La logique complète vit dans .github/hermes/gate.py (stdlib seule).
#
# Déclencheurs : `pull_request` (évaluation immédiate) et `workflow_run` sur la
# CI terminée (une seule évaluation par fin de CI, au lieu d'une par check —
# l'ancien déclencheur `check_run` créait une boucle : le gate crée son propre
# check, ce qui le relançait, et chaque relance annulait la précédente).
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Numéro de PR spécifique (vide = toutes les PR ouvertes)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  checks: write
  actions: read

concurrency:
  group: hermes-lite-${{ github.repository }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.HERMES_LITE_TOKEN || github.token }}
  # IMPORTANT (runbook §3) : variable de dépôt HERMES_REQUIRED_CHECKS —
  # noms de jobs CI requis avant merge, séparés par des virgules.
  # Vide = merge dès que la PR est fraîche (à éviter en production).
  HERMES_REQUIRED_CHECKS: ${{ vars.HERMES_REQUIRED_CHECKS || '' }}
  # HERMES_AUTO_REBASE=0 : pas de rebase serveur par le gate (le push du
  # GITHUB_TOKEN ne relance pas la CI : le nouveau head n'aurait aucun check).
  HERMES_AUTO_REBASE: ${{ vars.HERMES_AUTO_REBASE || '1' }}
  MERGE_METHOD: rebase

jobs:
  gate:
    name: Verdict
    runs-on: [self-hosted, jauge-worker]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Gate
        run: |
          export INPUT_PR_NUMBER="${{ github.event.inputs.pr_number }}"
          export HERMES_LITE_DRY_RUN="${{ vars.HERMES_LITE_DRY_RUN || '0' }}"
          python3 .github/hermes/gate.py
