# File de merge Mergify — socle CI self-hosted (R630).
#
# Les queue_conditions exigent les quatre jobs de la CI réelle du dépôt
# (`lint`, `limits`, `test`, `iac` — .github/workflows/ci.yml) plus le garde-fou
# `ci-budget` et `stale-base-guard`. Noms de checks = noms de JOBS (vérifiés via
# `gh pr view --json statusCheckRollup`), pas `Workflow / job`.
#
# ⚠ PILOTAGE : au 2026-11-11 le produit Merge Queue n'est pas encore activé pour
# ce dépôt (geste humain sur dashboard.mergify.com). En attendant, le pilote de
# merge est le gate `hermes-lite` (variable HERMES_LITE_DRY_RUN=0). Dès que
# Mergify est actif, remettre HERMES_LITE_DRY_RUN=1 : un seul pilote à la fois.
# Structure copiée du .mergify.yml de BaptisteFaisy/duello (décision
# user 2026-10-10) : inline labels urgent / priority-low identiques.
queue_rules:
  - name: default
    queue_conditions:
      # Budget CI 5 min (règle user 2026-10-24) : le garde-fou du socle.
      - check-success = ci-budget
      # CI réelle du dépôt (ajoutée le 2026-11-11).
      - check-success = lint
      - check-success = limits
      - check-success = test
      - check-success = iac
      - check-success = stale-base-guard
      - -conflict
      - -draft
      - base = main
    batch_size:
      min: 1
      max: 3
    batch_max_wait_time: "30 seconds"
    max_checks_retries: 1
    merge_method: rebase
    update_method: rebase

priority_rules:
  - name: urgent
    conditions:
      - label = urgent
    priority: high
  - name: priority-low
    conditions:
      - label = priority-low
    priority: low

merge_queue:
  # N workers self-hosted (R630, labels jauge-worker) ; la speculation
  # Mergify reste bornee a 4, ajustable.
  max_parallel_checks: 4

# Auto-queue natif (produit Merge Queue) : évite de dépendre du produit
# « Workflow Automation » (pull_request_rules), constaté désactivé le 24/10.
merge_protections_settings:
  auto_merge_conditions: true
